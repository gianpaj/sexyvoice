name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, ready_for_review]

jobs:
  # Review automatically on opening/ready-for-review, or on "@claude review".
  # Both the original actor and the rerun actor must be explicitly trusted.
  claude-review:
    if: |
      contains(fromJSON('["gian0pa", "gianpaj"]'), github.actor) &&
      contains(fromJSON('["gian0pa", "gianpaj"]'), github.triggering_actor) &&
      (
        (github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.user.type == 'User') ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude review'))
      )
    # One review per PR at a time. Newer reviews queue, and GitHub keeps only
    # the newest pending one.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read # Grants the workflow permission to read CI results
      checks: read # Allows watching check progress
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      # Resolve the PR head before installing its dependencies. Comment events
      # carry no PR SHA, and a fork could push after the maintainer's request.
      - name: Resolve PR head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pr=$(gh pr view "$PR_NUMBER" --json headRefOid,baseRefOid,isCrossRepository)
          if [[ $(jq -r .isCrossRepository <<< "$pr") == true ]]; then
            echo '::error::Claude reviews do not run on fork PRs.'
            exit 1
          fi
          jq -r '"sha=" + .headRefOid + "\nbase=" + .baseRefOid' <<< "$pr" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        # pnpm's version comes from `packageManager` in package.json.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # /review-pr and its five reviewer agents live in the action's own
      # repository. The runner downloads every action in this job before the
      # first step, so copy them from that download: the `uses:` pin below is
      # the only version to update. The action replaces .claude/ in the checkout
      # with the base branch's copy before Claude starts, so install them as
      # user-level config instead.
      - name: Install /review-pr command and reviewer agents
        run: |
          # The runner's action cache layout is undocumented; fail if it changes.
          shopt -s nullglob
          dirs=("$RUNNER_WORKSPACE"/../_actions/anthropics/claude-code-action/*/.claude)
          if (( ${#dirs[@]} != 1 )); then
            echo "::error::Expected one downloaded claude-code-action, found ${#dirs[@]}."
            exit 1
          fi
          mkdir -p ~/.claude/commands ~/.claude/agents
          cp "${dirs[0]}/commands/review-pr.md" ~/.claude/commands/
          # The pinned agents have unquoted descriptions containing YAML delimiters.
          python3 - "${dirs[0]}/agents" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          for source in Path(sys.argv[1]).glob('*.md'):
              _, frontmatter, body = source.read_text().split('---\n', 2)
              frontmatter = re.sub(
                  r'^description: (.+)$',
                  lambda match: 'description: ' + json.dumps(match[1]),
                  frontmatter,
                  count=1,
                  flags=re.MULTILINE,
              )
              destination = Path.home() / '.claude' / 'agents' / source.name
              destination.write_text('---\n' + frontmatter + '---\n' + body)
          PY

      # Claude returns the review as structured output and the next step posts
      # it, so publication never depends on Claude choosing to comment.
      - name: PR Review
        id: review
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Allow Claude to read CI runs and logs using its separate GitHub App token.
          # Job-level permissions only apply to the workflow's GITHUB_TOKEN.
          additional_permissions: |
            actions: read
            checks: read
          # Agent mode keeps /review-pr at the start of the SDK prompt.
          prompt: |
            /review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ env.PR_NUMBER }}

            Review the whole PR diff: git diff ${{ steps.pr.outputs.base }}...${{ steps.pr.outputs.sha }}.
            Run it and give each reviewer the output; the reviewers cannot run Bash.
            Do not review newer commits.

            Report the "Run Unit Tests" result for this commit:
            gh run list --repo ${{ github.repository }} --workflow tests.yml --commit ${{ steps.pr.outputs.sha }} --limit 1 --json databaseId,status,conclusion,url
            If it is still running, wait at most 5 minutes with
            gh run watch <run-id> --repo ${{ github.repository }} --interval 15.
            If it is still pending after that, say so.

            Return the final review in the `review` field: a short assessment, the
            noteworthy findings, and the CI result. Return it even if there are no
            noteworthy findings. Inline comments are fine, but put general
            observations in the review field. Do not post any top-level PR comment;
            the workflow posts the review.
          claude_args: |
            --json-schema '{"type":"object","properties":{"review":{"type":"string"}},"required":["review"]}'
            --allowedTools "Bash(pnpm:*),Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh run watch:*),Bash(sleep 15),mcp__github_inline_comment__create_inline_comment"
            --model "claude-opus-5-5"
            --effort xhigh

      - name: Publish review
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW: ${{ fromJSON(steps.review.outputs.structured_output).review }}
          REVIEW_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "$REVIEW"$'\n\n'"Reviewed commit: $REVIEW_SHA"

  # General-purpose assistant triggered by "@claude" (without "review") in
  # issues, PR comments, and reviews. Can run CI commands and push commits.
  claude:
    if: |
      contains(fromJSON('["gian0pa", "gianpaj"]'), github.actor) &&
      contains(fromJSON('["gian0pa", "gianpaj"]'), github.triggering_actor) &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude review')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && !contains(github.event.review.body, '@claude review')) ||
        (github.event_name == 'issues' && github.event.action == 'assigned' && github.event.assignee.login == 'claude-bot') ||
        (github.event_name == 'issues' && github.event.action == 'opened' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Grants the workflow permission to read CI results
      checks: read # Allows watching check progress
    env:
      # Unit tests use the Redis service below, so skip redis-memory-server's
      # binary download when Claude runs `pnpm install`.
      REDISMS_DISABLE_POSTINSTALL: 1
    steps:
      # Resolve the PR head before installing its dependencies; the action's
      # own PR checkout happens after our install step.
      - name: Resolve PR head
        id: pr-head
        if: github.event.issue.pull_request || github.event.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          # Comment events carry no PR SHA, so a fork could push after the
          # maintainer's request. Only collaborators can push same-repo branches.
          pr=$(gh pr view "$PR_NUMBER" --json headRefOid,isCrossRepository)
          if [[ $(jq -r .isCrossRepository <<< "$pr") == true ]]; then
            echo '::error::@claude does not run on fork PRs.'
            exit 1
          fi
          jq -r '"sha=" + .headRefOid' <<< "$pr" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Empty for issue events, which keeps the event's own ref.
          ref: ${{ steps.pr-head.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        # pnpm's version comes from `packageManager` in package.json.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unit tests connect to Redis on localhost when CI is set.
      - name: Start Redis
        uses: supercharge/redis-github-action@bc274cb7238cd63a45029db04ee48c07a72609fd # 1.8.1
        with:
          redis-version: 7

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Allow Claude to read CI runs and logs using its separate GitHub App token.
          # Job-level permissions only apply to the workflow's GITHUB_TOKEN.
          additional_permissions: |
            actions: read
            checks: read
          # Trigger when specific user is assigned to an issue
          assignee_trigger: "claude-bot"
          claude_args: |
            --allowedTools "Bash(pnpm:*),Bash(git:*),Bash(gh pr view:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh run watch:*),Bash(sleep 15),mcp__github_inline_comment__create_inline_comment"
            --model "claude-opus-5-5"
            --effort xhigh
