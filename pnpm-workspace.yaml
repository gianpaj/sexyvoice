packages:
  - "apps/*"
  - "packages/*"
  - "scripts"

publicHoistPattern:
  - "*import-in-the-middle*"
  - "*require-in-the-middle*"

minimumReleaseAge: 2880

minimumReleaseAgeExclude:
  - next
  - "@next/*"
  - react
  - react-dom

catalog:
  "@ai-sdk/react": "3.0.292"
  "@biomejs/biome": "2.5.14"
  "@supabase/supabase-js": "2.116.0"
  "@tailwindcss/postcss": "4.2.2"
  "@types/node": "24.10.4"
  "@types/react": "19.2.16"
  "@types/react-dom": "19.2.3"
  "@upstash/redis": "1.37.0"
  "ai": "6.0.289"
  "effective-progress": "0.12.0"
  "effect": "4.0.0"
  "next": "16.3.8"
  "postcss": "8.5.28"
  "react": "19.2.7"
  "react-dom": "19.2.7"
  "tailwindcss": "4.2.2"
  "tsx": "4.19.3"
  "typescript": "7.0.2"
  "zod": "4.4.3"

overrides:
  "@babel/runtime@<7.26.10": ">=7.26.10"
  "@opentelemetry/auto-instrumentations-node": "0.76.0"
  "@opentelemetry/exporter-prometheus": "0.218.0"
  "@opentelemetry/exporter-trace-otlp-http": "0.218.0"
  "@opentelemetry/sdk-node": "0.218.0"
  "fast-xml-parser@>=4.3.6 <=5.3.3": ">=5.3.7"
  "immutable@>=5.0.0-beta.1 <5.1.8": "5.1.9"
  "protobufjs@<7.5.8": "7.6.6"
  "protobufjs@>=8.0.0 <8.2.0": "8.4.0"
  # Scope the TOML security fix to this consumer to avoid forcing a major bump on others.
  "remark-mdx-frontmatter>toml": "4.2.0"
  "require-in-the-middle": "7.5.2"
  "undici@<5.28.4": ">=5.28.4"
  "undici@<=5.28.2": ">=5.28.3"
  "undici@>=4.5.0 <5.28.5": ">=5.28.5"
  "ultracite>zod": "4.3.6"
  "unbash>zod": "4.3.6"
  "vite@>=7.0.0 <7.3.2": "7.3.6"
  "whatwg-url": "^14.0.0"

allowBuilds:
  "@google/genai": false
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  contentlayer2: true
  core-js: true
  core-js-pure: true
  esbuild: true
  msgpackr-extract: false
  msw: true
  onnxruntime-node: false
  protobufjs: true
  redis-memory-server: false
  sharp: true
